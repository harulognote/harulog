<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HaruLog 로그인</title><link rel="stylesheet" href="/static/style.css?v=2.9.17"></head>
<body><main class="login-shell"><section class="input-card login-card"><h1>HaruLog<span>.</span></h1><h2 id="loginTitle">로그인</h2><p id="loginHelp" class="score-help">상태를 확인하고 있습니다.</p>
<form id="loginForm" hidden><label id="setupCodeLabel" hidden>최초 관리자 설정 코드<input id="setupCode" type="password" autocomplete="off" maxlength="512" placeholder="서버 콘솔 링크의 #setup= 뒤 코드"></label><label>아이디<input id="loginUsername" autocomplete="username" minlength="3" maxlength="64" required></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" maxlength="256" required></label><label id="rememberUsernameLabel" class="remember-username" hidden><input id="rememberUsername" type="checkbox">아이디 기억하기</label><label id="loginConfirmLabel" hidden>비밀번호 확인<input id="loginConfirm" type="password" autocomplete="new-password" maxlength="256"></label><button id="loginSubmit" type="submit" class="btn-submit">로그인</button></form>
<button id="signupToggle" type="button" class="btn-cancel" hidden>회원가입</button><p id="loginStatus" role="status" aria-live="polite" class="settings-status"></p><p class="score-help">개인 기록과 사진은 로그인 후 이용할 수 있습니다.</p><p class="score-help">HaruLog v2.9.17</p></section></main><script src="/static/login.js?v=2.9.17"></script></body></html>
